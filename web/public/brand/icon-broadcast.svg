<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HTN Market">
  <title>A badge broadcasting a price</title>
  <!-- A hackathon badge: ink body, paper screen, hard edges, no gradients.
       The bezel is kept thin so the artwork still reads at favicon size. -->
  <rect x="5" y="2" width="54" height="60" rx="8" fill="#14110e"/>
  <rect x="25" y="6.5" width="14" height="3" rx="1.5" fill="#837a6c"/>
  <rect x="9" y="13" width="46" height="41" rx="3" fill="#efe9db"/>
  <!-- Solana's three slanted bars, stepped upward so the same shape reads as
       a market climbing. The gold one breaks out over the bezel: the price is
       leaving the screen, which is what a badge that trades actually does. -->
  <path d="M17 42 L36 42 L30 50 L11 50 Z" fill="#14110e"/>
  <path d="M23 31 L42 31 L36 39 L17 39 Z" fill="#146b3a"/>
  <path d="M29 20 L58 20 L52 28 L23 28 Z" fill="#c8912a"/>
</svg>
