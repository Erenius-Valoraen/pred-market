<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HTN Market">
  <title>Solana's bars as a candlestick</title>
  <rect width="64" height="64" rx="12" fill="#14110e"/>
  <!-- Three slanted bars, Solana's signature - but the middle one carries a
       candlestick's wicks, so the same shape reads as a price. -->
