<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HTN Market — bet on Hack the North</title>
<meta name="description" content="A play-money prediction market on Hack the North 2026, priced by a Solana program." />
<meta name="theme-color" content="#efe9db" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2314110e'/><path d='M8 21l5-7 4 4 7-9' stroke='%23c8912a' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <header class="top">
    <a class="brand" href="#markets"><span class="mark">HM</span><span class="name">HTN Market</span></a>
    <span class="live" id="live">live</span>
    <span class="spacer"></span>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Sections">
      <span class="indicator" id="tab-indicator"></span>
      <button role="tab" data-view="markets" aria-selected="true">Markets</button>
      <button role="tab" data-view="leaders" aria-selected="false">Leaderboard</button>
      <button role="tab" data-view="register" aria-selected="false">Register a team</button>
    </nav>
    <div id="wallet" class="row"></div>
  </header>

  <main id="main" class="with-rail">
    <div id="view"></div>
    <aside class="rail" id="rail"></aside>
  </main>

  <nav class="bottom" id="bottom-nav" role="tablist" aria-label="Sections">
    <button role="tab" data-view="markets" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-7 4 4 8-9"/><path d="M14 5h7v7"/></svg>
      Markets
    </button>
    <button role="tab" data-view="leaders" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 01-10 0z"/><path d="M17 5h3a3 3 0 01-3 3"/><path d="M7 5H4a3 3 0 003 3"/></svg>
      Leaders
    </button>
    <button role="tab" data-view="register" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      Register
    </button>
    <button role="tab" data-view="you" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-6.2-8.6"/><path d="M12 7v5l3 2"/></svg>
      You
    </button>
  </nav>

  <div id="toasts"></div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
