  <path d="M21 28 L44 28 L38 36 L15 36 Z" fill="#146b3a"/>
  <rect x="28" y="19" width="4" height="30" fill="#146b3a"/>
  <path d="M24 13 L47 13 L41 21 L18 21 Z" fill="#c8912a"/>
</svg>
